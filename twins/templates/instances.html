{% extends "base.html" %}

{% block title %}Gêmeos Digitais{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Gêmeos Digitais</h2>

    <!-- Filtro por Sistema -->
    <form method="GET" class="mb-4 d-flex align-items-center">
        <label for="system-filter" class="form-label me-2"><strong>Filtrar por Sistema:</strong></label>
        <select name="system_id" id="system-filter" class="form-select me-3" onchange="this.form.submit()">
            <option value="">Todos os Sistemas</option>
            {% for system in systems %}
                <option value="{{ system.id }}" {% if selected_system and selected_system.id == system.id %}selected{% endif %}>
                    {{ system.name }}
                </option>
            {% endfor %}
        </select>
    </form>
</div>
<div class="container-fluid mt-5 d-flex">
    
    <!-- Container do Grafo -->
    <div id="graph-container-wrapper">
        <div id="graph-container">
            <svg id="graph-svg"></svg>
            <div id="minimap-container">
                <svg id="minimap-svg"></svg>
            </div>
        </div>
        <div id="zoom-controls">
            <button onclick="zoomIn()">+</button>
            <button onclick="zoomOut()">-</button>
        </div>
    </div>

    <!-- Painel Lateral de Informações -->
    <div id="info-panel">
        <button id="toggle-panel-btn" class="btn btn-dark" onclick="togglePanel()">
            <span class="menu-icon">&#9776;</span>
        </button>
        <div class="panel-header">
            <h3 id="panel-title">Informações</h3>
        </div>
        <div id="panel-content-wrapper">
            <p id="panel-content">
                {% if selected_system %}
                    <strong>{{ selected_system.name }}</strong> - {{ selected_system.description }}
                {% else %}
                    <strong>Exibindo todos os sistemas.</strong>
                {% endif %}
            </p>
            <div id="non-editable-properties"></div>
            <div id="editable-properties-wrapper" style="display: none;">
                <h4>Propriedades</h4>
                <div id="dt-properties"></div>
            </div>
            <button id="save-btn" class="btn btn-primary mt-3" onclick="saveProperties()" style="display: none;">Salvar Alterações</button>
        </div>
    </div>
</div>

<style>
    /* Ajusta a visualização */
    .container-fluid {
        display: flex;
        height: calc(100vh - 60px);
    }

    /* Painel lateral fixo */
    #info-panel {
        width: 400px;
        background: white;
        box-shadow: -2px 0px 5px rgba(0,0,0,0.2);
        padding: 20px;
        overflow-y: auto;
        height: 100%;
        transition: width 0.3s;
        position: relative;
    }

    /* Cabeçalho do painel */
    .panel-header {
        display: flex;
        align-items: center;
        margin-left: 50px; /* Adiciona margem para o ícone */
    }

    /* Botão de colapsar painel */
    #toggle-panel-btn {
        position: absolute;
        top: 10px;
        left: 10px;
        background-color: #343a40;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: white;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    .menu-icon {
        font-size: 24px;
    }

    /* Área do Grafo com Scroll */
    #graph-container-wrapper {
        flex: 1;
        overflow: auto;
        border: 1px solid #ddd;
        position: relative;
    }

    #graph-container {
        width: 100%;
        height: 100%;
        position: relative;
    }

    #graph-svg {
        width: 100%;
        height: 100%;
    }

    /* Minimap */
    #minimap-container {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 200px;
        height: 150px;
        border: 1px solid #ddd;
        background: white;
    }

    #minimap-svg {
        width: 100%;
        height: 100%;
    }

    #zoom-controls {
        position: absolute;
        top: 10px;
        right: 10px;
        display: flex;
        flex-direction: column;
    }

    #zoom-controls button {
        background-color: #343a40;
        color: white;
        border: none;
        padding: 5px;
        margin: 2px 0;
        cursor: pointer;
    }

    .minimap-viewport {
        fill: rgba(128, 128, 128, 0.5);
        stroke: red;
        stroke-width: 2px;
        pointer-events: all;
    }
</style>
<!-- D3.js para a visualização do grafo -->
<script src="https://d3js.org/d3.v7.min.js"></script>

<script>
    let selectedInstanceId = null;
    let editableProperties = [];
    let zoomLevel = 1;
    let viewport;

    document.addEventListener("DOMContentLoaded", function () {
        let width = 800, height = 600;
        let svg = d3.select("#graph-svg")
                    .attr("width", width)
                    .attr("height", height);

        let minimapSvg = d3.select("#minimap-svg")
                           .attr("width", 200)
                           .attr("height", 150);

        let instances = JSON.parse('{{ instances_json|safe }}');
        let relationships = JSON.parse('{{ relationships_json|safe }}');

        let simulation = d3.forceSimulation(instances)
            .force("link", d3.forceLink(relationships).id(d => d.id).distance(150))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2));

        let link = svg.selectAll("line")
            .data(relationships)
            .enter().append("line")
            .style("stroke", "#999")
            .style("stroke-width", "2px");

        let node = svg.selectAll("circle")
            .data(instances)
            .enter().append("circle")
            .attr("r", 15)
            .attr("fill", "#007bff")
            .on("click", function(event, d) {
                showPanel(d);
            })
            .call(d3.drag()
                .on("start", dragStarted)
                .on("drag", dragged)
                .on("end", dragEnded));

        let labels = svg.selectAll("text")
            .data(instances)
            .enter().append("text")
            .attr("dx", 18)
            .attr("dy", ".35em")
            .style("font-size", "14px")
            .style("fill", "#333")
            .text(d => d.name);

        simulation.on("tick", function () {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);

            labels
                .attr("x", d => d.x + 5)
                .attr("y", d => d.y + 5);

            // Atualiza o minimapa
            minimapSvg.selectAll("*").remove();
            minimapSvg.append("g")
                .attr("transform", `scale(${0.25})`)
                .append(() => svg.node().cloneNode(true));

            // Adiciona o retângulo semitransparente
            viewport = minimapSvg.append("rect")
                .attr("class", "minimap-viewport")
                .attr("width", 200 / zoomLevel)
                .attr("height", 150 / zoomLevel)
                .attr("x", 0)
                .attr("y", 0)
                .call(d3.drag().on("drag", function(event) {
                    let x = Math.max(0, Math.min(event.x, 200 - viewport.attr("width")));
                    let y = Math.max(0, Math.min(event.y, 150 - viewport.attr("height")));
                    svg.attr("viewBox", `${x * zoomLevel} ${y * zoomLevel} ${width / zoomLevel} ${height / zoomLevel}`);
                    viewport.attr("x", x).attr("y", y);
                }));

            minimapSvg.on("click", function(event) {
                let [x, y] = d3.pointer(event);
                x = Math.max(0, Math.min(x, 200 - viewport.attr("width")));
                y = Math.max(0, Math.min(y, 150 - viewport.attr("height")));
                svg.attr("viewBox", `${x * zoomLevel} ${y * zoomLevel} ${width / zoomLevel} ${height / zoomLevel}`);
                viewport.attr("x", x).attr("y", y);
            });
        });

        function dragStarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragEnded(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        function showPanel(data) {
            selectedInstanceId = data.id;
            document.getElementById("panel-title").innerText = data.name;
            document.getElementById("panel-content").innerHTML = `<strong>Modelo:</strong> ${data.model}`;

            let nonEditablePropertiesHTML = "";
            let propertiesHTML = "";
            editableProperties = []; // Resetando propriedades editáveis

            data.properties.forEach(prop => {
                if (prop.can_edit) {
                    propertiesHTML += `<p>
                        <strong>${prop.name}:</strong>
                        <input type="text" id="prop-${prop.id}" value="${prop.value}">
                        <span data-hint="${prop.causal ? 'Causal' : 'Não Causal'}">${prop.causal ? '⚠️' : ''}</span>
                    </p>`;
                    editableProperties.push({ id: prop.id, name: prop.name, value: prop.value });
                } else {
                    nonEditablePropertiesHTML += `<p>
                        <strong>${prop.name}:</strong> ${prop.type} - ${prop.value}
                    </p>`;
                }
            });

            document.getElementById("non-editable-properties").innerHTML = nonEditablePropertiesHTML;
            document.getElementById("dt-properties").innerHTML = propertiesHTML;
            document.getElementById("editable-properties-wrapper").style.display = editableProperties.length > 0 ? "block" : "none";
            document.getElementById("save-btn").style.display = editableProperties.length > 0 ? "block" : "none";
        }
    });

    function saveProperties() {
        if (!selectedInstanceId) {
            alert("Nenhum Gêmeo Digital selecionado.");
            return;
        }

        let updatedProperties = editableProperties.map(prop => {
            let inputField = document.getElementById(`prop-${prop.id}`);
            return { id: prop.id, name: prop.name, value: inputField.value };
        });

        fetch(`/instances/${selectedInstanceId}/properties/update/`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ properties: updatedProperties })
        }).then(response => {
            if (!response.ok) {
            return response.json().then(errorData => {
                throw new Error(errorData.message || "Erro ao atualizar propriedades");
            });
            }
            return response.json();
        })
        .then(data => alert("Propriedades atualizadas com sucesso!"))
        .catch(error => alert(error.message));
    }

    function togglePanel() {
        let panel = document.getElementById("info-panel");
        let toggleBtn = document.getElementById("toggle-panel-btn");
        let panelContentWrapper = document.getElementById("panel-content-wrapper");
        if (panel.style.width === "0px") {
            panel.style.width = "400px";
            panelContentWrapper.style.display = "block";
            toggleBtn.innerHTML = '<span class="menu-icon">&#9776;</span>';
        } else {
            panel.style.width = "0px";
            panelContentWrapper.style.display = "none";
            toggleBtn.innerHTML = '<span class="menu-icon">&#9776;</span>';
        }
    }

    function zoomIn() {
        zoomLevel += 0.1;
        d3.select("#graph-svg").attr("transform", `scale(${zoomLevel})`);
        updateViewport();
    }

    function zoomOut() {
        zoomLevel -= 0.1;
        d3.select("#graph-svg").attr("transform", `scale(${zoomLevel})`);
        updateViewport();
    }

    function updateViewport() {
        let width = 800, height = 600;
        let x = parseFloat(viewport.attr("x"));
        let y = parseFloat(viewport.attr("y"));
        viewport.attr("width", 200 / zoomLevel)
                .attr("height", 150 / zoomLevel);
        d3.select("#graph-svg").attr("viewBox", `${x * zoomLevel} ${y * zoomLevel} ${width / zoomLevel} ${height / zoomLevel}`);
    }

    document.addEventListener("keydown", function(event) {
        if (event.shiftKey && event.key === "+") {
            zoomIn();
        } else if (event.shiftKey && event.key === "-") {
            zoomOut();
        }
    });

    document.addEventListener("wheel", function(event) {
        if (event.shiftKey) {
            if (event.deltaY < 0) {
                zoomIn();
            } else {
                zoomOut();
            }
        }
    });
</script>

{% endblock %}
